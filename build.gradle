plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id
base { archivesName = mod_id }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

neoForge {
    version = project.neo_version

    // Parchment is configured in gradle.properties via the neoForge.parchment.* keys.

    // Fail the build when an access transformer points at something that moved,
    // instead of failing at runtime with a NoSuchMethodError.
    validateAccessTransformers = true

    runs {
        client {
            client()
            gameDirectory = project.file('run/client')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        server {
            server()
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        // Headless GameTest run on a real dedicated server - the only proof of
        // entity behaviour available on a machine without a GUI.
        gameTests {
            type = 'gameTestServer'
            gameDirectory = project.file('run/gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        data {
            data()
            gameDirectory = project.file('run/data')
            programArguments.addAll(
                    '--mod', mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        create(mod_id) { sourceSet sourceSets.main }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(mod_id)
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

repositories {
    mavenCentral()
}

dependencies {
    // No library dependency: every OreSpawn model maps onto vanilla ModelPart (docs/DECISIONS.md, R8).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    // ModDevGradle runs the test JVM in a game directory, so a test that reads a
    // committed asset needs the absolute project path.
    systemProperty 'orespawn.projectDir', projectDir.absolutePath
}

// javac defaults to the platform charset (windows-1252 here); the sources are UTF-8.
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach { systemProperty 'file.encoding', 'UTF-8' }

// Only neoforge.mods.toml is expanded - Groovy's template engine treats every $
// as a variable, and the JSON assets are full of them.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            mod_issue_url          : mod_issue_url,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

// Deterministic jars: the same commit must produce the same bytes, otherwise the
// modpack lockfile in the parent repo churns on every build.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
