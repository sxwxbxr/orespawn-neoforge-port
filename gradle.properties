# Every version here is pinned deliberately and matches mods/architrave and
# mods/armature, which build green on this machine with the same toolchain.

org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Community parameter names and javadoc for the decompiled Minecraft sources.
neoForge.parchment.minecraftVersion=1.21.1
neoForge.parchment.mappingsVersion=2024.11.17

## Mod identity
mod_id=orespawn
mod_name=OreSpawn
mod_version=0.2.0
mod_group_id=com.swbr.orespawn
mod_authors=TheyCallMeDanger (original OreSpawn), swbr (1.21.1 port)
# Private port for personal use only. The original author reserved all rights and
# parts of the creature models belong to third-party modelers; see docs/research/.
mod_license=All Rights Reserved
mod_description=A private port of TheyCallMeDanger's OreSpawn (1.7.10, v20.3) to NeoForge 1.21.1. Not for redistribution.
mod_issue_url=https://github.com/sxwxbxr/orespawn-neoforge-port/issues

## Platform
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.248
# Only 21.1.248 is built and tested; claiming anything older would be a guess.
neo_version_range=[21.1.248,)
loader_version_range=[4,)

## Libraries
junit_version=5.11.3
